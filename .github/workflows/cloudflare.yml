name: Deploy to Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cloud/**'
      - 'frontend/**'
      - 'db/**'
      - 'drizzle/**'
      - 'wrangler.jsonc'
      - 'package*.json'
      - '.github/workflows/cloudflare.yml'

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: cloudflare-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TCG_ACCESS_TEAM_DOMAIN: ${{ vars.TCG_ACCESS_TEAM_DOMAIN }}
      TCG_ACCESS_AUD: ${{ vars.TCG_ACCESS_AUD }}
      TCG_WORKER_NAME: ${{ vars.TCG_WORKER_NAME }}
      TCG_D1_DATABASE_ID: ${{ vars.TCG_D1_DATABASE_ID }}
      TCG_R2_BUCKET_NAME: ${{ vars.TCG_R2_BUCKET_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc -p cloud/tsconfig.json
      - run: npm run deploy:cloudflare
